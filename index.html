
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BlueChart</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f3e9;
    }

    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f8f3e9;
    }

    #unity-canvas {
      display: block;
      width: min(100vw, 45vh);
      height: min(100vh, 222.2222vw);
      flex: none;
      background: #f8f3e9;
    }

    #unity-loading-bar {
      position: absolute;
      z-index: 2;
    }

    #unity-warning {
      position: absolute;
      z-index: 3;
      top: 8px;
      left: 8px;
      right: 8px;
    }

    #unity-footer {
      display: none;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="2400"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      const div = document.createElement("div");
      div.textContent = msg;
      div.style.cssText = "padding:10px;margin:5px;";

      if (type === "error") {
        div.style.background = "red";
        div.style.color = "white";
      } else if (type === "warning") {
        div.style.background = "yellow";
        div.style.color = "black";
        setTimeout(() => div.remove(), 5000);
      }

      warningBanner.appendChild(div);
    }

    function resizeCanvas() {
      const ratio = 1080 / 2400;
      const width = Math.min(
        window.innerWidth,
        window.innerHeight * ratio
      );

      canvas.style.width = width + "px";
      canvas.style.height = (width / ratio) + "px";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    const buildUrl = "Build";

    const config = {
      dataUrl: buildUrl + "/bluechart.data",
      frameworkUrl: buildUrl + "/bluechart.framework.js",
      codeUrl: buildUrl + "/bluechart.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BlueChart",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    const loaderScript = document.createElement("script");
    loaderScript.src = buildUrl + "/bluechart.loader.js";

    loaderScript.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then(function () {
        loadingBar.style.display = "none";
      }).catch(function (error) {
        unityShowBanner("読み込みエラー：" + error, "error");
      });
    };

    loaderScript.onerror = function () {
      unityShowBanner(
        "Build/bluechart.loader.js が読み込めません。Buildフォルダを確認してください。",
        "error"
      );
    };

    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
